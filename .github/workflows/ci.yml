name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:types
      - run: npm test
      - name: Browser tests
        if: matrix.node-version == 22
        run: npm run test:browser
      - name: Real-Redis integration tests
        if: matrix.node-version == 22
        env:
          ARCHX_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis
      - name: Packaged-artifact smoke test
        if: matrix.node-version == 22
        run: npm run test:pack
      - run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        if: matrix.node-version == 22
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Upload SBOM
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: archx-sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
