name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:types
      - run: npm run docs:check
      - run: npm test
      - name: Browser tests
        if: matrix.node-version == 22
        run: npm run test:browser
      - name: Real-Redis integration tests
        if: matrix.node-version == 22
        env:
          ARCHX_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis
      - name: Packaged-artifact smoke test
        if: matrix.node-version == 22
        run: npm run test:pack
      - run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        if: matrix.node-version == 22
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Upload SBOM
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: archx-sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  test-windows:
    # Windows parity gate (v1.28): the code and tests must run the same
    # on Windows as on Linux. Exclusions, each with a reason:
    # - Browser tests: @sparticuz/chromium ships a Linux Chromium build;
    #   a Windows browser matrix needs a different harness, tracked as a
    #   known gap (docs/COMPATIBILITY.md) rather than faked here.
    # - Real-Redis: service containers are Linux-only on GitHub runners.
    # Everything else — lint, build, types, docs consistency, the full
    # unit/fuzz suite (Sharp/libvips ship Windows binaries), and the
    # packaged-artifact smoke — runs identically.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:types
      - run: npm run docs:check
      - name: Run npm test
        run: node tools/run-tests-ci.mjs
      - run: npm run test:pack
