name: CodeQL alert API probe

on:
  push:
    branches: [arena/0362263e-archnemix-image-protection]

permissions: {}

jobs:
  list-open-alerts:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: List repository CodeQL alerts through the Actions token
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          page=1
          total=0
          while :; do
            status=$(curl --silent --show-error --output /tmp/alerts.json --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPOSITORY}/code-scanning/alerts?state=open&per_page=100&page=${page}")
            if [[ "$status" != 200 ]]; then
              echo "Code Scanning alerts API returned HTTP ${status}"
              cat /tmp/alerts.json
              exit 1
            fi
            count=$(node -e 'const a=JSON.parse(require("fs").readFileSync("/tmp/alerts.json","utf8")); if(!Array.isArray(a)) process.exit(2); console.log(a.length)')
            node - <<'NODE'
          const alerts = JSON.parse(require('fs').readFileSync('/tmp/alerts.json', 'utf8'));
          for (const a of alerts) {
            const loc = a.most_recent_instance?.location ?? {};
            console.log(JSON.stringify({
              number: a.number,
              state: a.state,
              rule: a.rule?.id,
              path: loc.path,
              start_line: loc.start_line,
              end_line: loc.end_line,
              html_url: a.html_url
            }));
          }
          NODE
            total=$((total + count))
            if (( count < 100 )); then break; fi
            page=$((page + 1))
          done
          echo "Open CodeQL alerts returned: ${total}"
          if (( total > 0 )); then
            echo "::warning::Open CodeQL alerts remain; the release gate is not satisfied."
          fi
