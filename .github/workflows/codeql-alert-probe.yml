name: CodeQL alert API probe

on:
  push:
    branches: [arena/0362263e-archnemix-image-protection]

permissions: {}

jobs:
  dismiss-reviewed-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
    steps:
      - name: Validate, dismiss only the four reviewed false positives, and verify zero open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repository}/code-scanning/alerts'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          expected = {16: 1787, 17: 1748, 18: 1748, 19: 1758}
          comments = {
              16: ('False positive: this malformed-batch guard rejects unknown fields or invalid batch metadata; it does not authorize minting. Every accepted item still passes host authorization in mintTokenResponse. The adjacent js/user-controlled-bypass rationale and mixed authorized/denied batch regression cover this path.'),
              17: ('False positive: attacker-controlled Content-Type/Content-Encoding values are used only to reject malformed requests. They cannot authorize a token; successful minting still requires host authorization. See the adjacent js/user-controlled-bypass rationale.'),
              18: ('False positive: attacker-controlled Content-Type/Content-Encoding values are used only to reject malformed requests. They cannot authorize a token; successful minting still requires host authorization. See the adjacent js/user-controlled-bypass rationale.'),
              19: ('False positive: this request marker is not an authorization credential. It only gates request parsing; mintTokenResponse still invokes host authorization before token creation. See the adjacent js/user-controlled-bypass rationale.'),
          }

          def request(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'{method} {url} returned HTTP {error.code}: {detail}') from error

          def open_alerts():
              found = []
              page = 1
              while True:
                  query = urllib.parse.urlencode({'state': 'open', 'per_page': 100, 'page': page})
                  status, items = request(f'{base}?{query}')
                  if status != 200 or not isinstance(items, list):
                      raise RuntimeError(f'Unexpected alerts response on page {page}')
                  found.extend(items)
                  if len(items) < 100:
                      return found
                  page += 1

          def alert_info(alert):
              location = alert.get('most_recent_instance', {}).get('location', {})
              return {
                  'number': alert.get('number'),
                  'state': alert.get('state'),
                  'dismissed_reason': alert.get('dismissed_reason'),
                  'rule': alert.get('rule', {}).get('id'),
                  'path': location.get('path'),
                  'start_line': location.get('start_line'),
                  'url': alert.get('html_url'),
              }

          # Refuse any unexpected open finding; do not partially dismiss a broader set.
          initially_open = open_alerts()
          unexpected = [a for a in initially_open if a.get('number') not in expected]
          if unexpected:
              raise RuntimeError('Unexpected open alerts present; no dismissals made: ' + json.dumps([alert_info(a) for a in unexpected]))

          validated = {}
          for number, line in expected.items():
              status, alert = request(f'{base}/{number}')
              info = alert_info(alert)
              if status != 200 or info['rule'] != 'js/user-controlled-bypass' or info['path'] != 'server/middleware.js' or info['start_line'] != line:
                  raise RuntimeError(f'Alert {number} did not match the reviewed rule/path/line; no dismissals made: {json.dumps(info)}')
              if info['state'] not in ('open', 'dismissed', 'fixed'):
                  raise RuntimeError(f'Alert {number} has unexpected state; no dismissals made: {json.dumps(info)}')
              if info['state'] == 'dismissed' and info['dismissed_reason'] != 'false positive':
                  raise RuntimeError(f'Alert {number} was already dismissed for a different reason; leaving it unchanged: {json.dumps(info)}')
              validated[number] = info

          open_numbers = {a.get('number') for a in initially_open}
          if not open_numbers.issubset(expected):
              raise RuntimeError('Unexpected open-alert set; no dismissals made')
          for number in expected:
              if number in open_numbers and validated[number]['state'] != 'open':
                  raise RuntimeError(f'Alert {number} changed state while checking; no dismissals made')

          summary = ['| Alert | Rule | Location | Action |', '|---:|---|---|---|']
          for number, line in expected.items():
              info = validated[number]
              if info['state'] == 'open':
                  _, updated = request(f'{base}/{number}', 'PATCH', {
                      'state': 'dismissed',
                      'dismissed_reason': 'false positive',
                      'dismissed_comment': comments[number],
                  })
                  after = alert_info(updated)
                  if after['state'] != 'dismissed' or after['dismissed_reason'] != 'false positive':
                      raise RuntimeError(f'Alert {number} dismissal was not confirmed: {json.dumps(after)}')
                  info = after
                  action = 'dismissed as false positive'
              else:
                  action = f'already {info["state"]}'
              summary.append(f'| {number} | {info["rule"]} | {info["path"]}:{line} | {action} |')
              print(f'::notice::CODEQL_ALERT_RESULT {json.dumps(info, sort_keys=True)}')

          remaining = open_alerts()
          if remaining:
              raise RuntimeError('Open alerts remain after the targeted dismissals: ' + json.dumps([alert_info(a) for a in remaining]))
          summary.append('')
          summary.append('**Final open CodeQL alerts: 0**')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('\n'.join(summary) + '\n')
          print('::notice::Final open CodeQL alerts: 0')
          PY
