name: Publish to npm (OIDC + provenance)

# Trusted publishing: configure this repo/workflow as a trusted publisher on
# npmjs.com for @archnemix/image-protection before first use, then publish by
# creating a GitHub Release (or running this workflow manually on a version
# tag). No long-lived npm token exists anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Release tag must match package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          test "v${PKG_VERSION}" = "${{ github.event.release.tag_name }}" || {
            echo "tag ${{ github.event.release.tag_name }} != package v${PKG_VERSION}" >&2; exit 1; }
      - run: npm run verify
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: archx-sbom-publish
          path: sbom.cdx.json
          if-no-files-found: error
      - run: npm publish --provenance --access public
