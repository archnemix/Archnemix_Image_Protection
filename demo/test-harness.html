<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archx test harness</title>
<style>
  body { background:#111; color:#eee; font-family:system-ui; }
  .box { width:340px; height:230px; margin:10px; display:inline-block; vertical-align:top; background:#222; }
  .box > div, .box > img { width:100%; height:100%; object-fit:cover; display:block; }
  archx-image { width:100%; height:100%; }
</style>
</head>
<body>
<h1>Archx automated-test harness (not the demo — see /)</h1>

<div class="box"><img id="normal" src="/demo/public-unprotected/aurora-valley.jpg" alt="normal"></div>
<div class="box"><div id="t-lite"></div></div>
<div class="box"><div id="t-shield"></div></div>
<div class="box"><div id="t-vault"></div></div>
<div class="box"><div id="t-fortress"></div></div>
<div class="box"><div id="t-split"></div></div>
<div class="box"><div id="t-closed"></div></div>
<div class="box"><div id="t-clientonly"></div></div>
<div id="gallery" style="display:grid;grid-template-columns:repeat(5,160px);gap:6px"></div>

<script type="module">
import Archx from '/src/index.js';

window.__attempts = [];
document.addEventListener('archx-attempt', (e) => window.__attempts.push(e.detail.kind));

Archx.config({ tokenEndpoint: '/archx/token/' });

// debug:true is a TEST-ONLY hook so the suite can play "attacker who found
// the canvas in DevTools". The `closed` instance deliberately leaves it off
// to verify production encapsulation. NEVER ship debug:true.
const common = { lazy: false, watermark: '© TEST · {session}', onExtract: 'black', debug: true };
window.__instances = {
  lite: Archx.load.image('#t-lite', { id: 'gallery-001' }, { ...common, mode: 'lite', shadow: 'open' }),
  shield: Archx.load.image('#t-shield', { id: 'aurora-valley' }, { ...common, mode: 'shield', shadow: 'open' }),
  vault: Archx.load.image('#t-vault', { id: 'luxury-watch' }, { ...common, mode: 'vault', shadow: 'open' }),
  fortress: Archx.load.image('#t-fortress', { id: 'neon-portrait' },
    { ...common, mode: 'fortress', shadow: 'open', lens: true, automation: 'monitor' }),
  split: Archx.load.image('#t-split', { id: 'neon-portrait' }, { ...common, mode: 'shield', shadow: 'open', splitCanvases: true, splitGrid: 3 }),
  closed: Archx.load.image('#t-closed', { id: 'gallery-002' }, { ...common, debug: false, mode: 'shield', shadow: 'closed' }),
  clientOnly: Archx.load.image('#t-clientonly', '/demo/public-unprotected/neon-portrait.jpg', { ...common, mode: 'shield', shadow: 'open' }),
};
window.__ready = Promise.allSettled(Object.values(window.__instances).map((i) => i.ready))
  .then(() => new Promise((r) => setTimeout(r, 350))) // let vault present a few frames
  .then(() => { window.__allLoaded = true; });

window.__loadGallery = (n = 100) => {
  const items = Array.from({ length: n }, (_, i) => ({ id: 'gallery-' + String(i + 1).padStart(3, '0') }));
  const t0 = performance.now();
  const { instances, ready } = Archx.load.gallery('#gallery', items, { mode: 'lite', lazy: false, shadow: 'closed' });
  window.__galleryInstances = instances;
  return ready.then(() => ({ ms: performance.now() - t0, count: instances.length }));
};
window.Archx = Archx;
</script>
</body>
</html>
